<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #1C1B1A; text-wrap: pretty">We present LMEnt, a suite including a knowledge-rich pretraining corpus, fully annotated with entity mentions based on Wikipedia; an entity-based retrieval method over pretraining data that outperforms existing tools by as much as 80.4%; and 12 pretrained LMs with up to 1B parameters and 4K intermediate checkpoints, with comparable performance to popular open-source models on knowledge tasks. Below, we cover our entity annotation method, the LMEnt models, and applications of LMEnt to mechanistic interpretability, learning dynamics, knowledge editing, plasticity, attribution, and hallucinations.</p>
</div>

<section style="display: flex; flex-direction: column; gap: 28px" aria-labelledby="intro-title">
<div style="display: flex; flex-direction: column; gap: 18px">
<h2 id="intro-title" style="margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600; font-size: 40px; line-height: 1.1">Introduction</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #2A2826; text-wrap: pretty">Language models capture substantial amounts of knowledge and beliefs about the world from their training data. A fundamental, yet underexplored, question is how such knowledge representations are formed and shaped during pretraining. Namely, what is the interplay between data composition, training dynamics, and the internal knowledge mechanisms in LMs?</p>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #2A2826; text-wrap: pretty">A key prerequisite for studying this question is the ability to locate exactly where specific knowledge appears in the pretraining data. However, since such metadata is rarely available for pretraining corpora, many works that study knowledge acquisition have used synthetic data, or post-hoc string-based search tools which lack robustness against variability in phrasing. For example, when retrieving information about the American football team the <span style="background: #D3E8C6; border-radius: 4px; padding: 1px 4px">Buffalo Bills</span>, these tools are less likely to retrieve documents that refer to the team as <span style="background: #D3E8C6; border-radius: 4px; padding: 1px 4px">Buffalo</span>, <span style="background: #D3E8C6; border-radius: 4px; padding: 1px 4px">The Bills</span>, or even <span style="background: #D3E8C6; border-radius: 4px; padding: 1px 4px">the team</span>.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #2A2826; text-wrap: pretty">In this work, we’re excited to introduce <strong style="font-weight: 700; color: #1C1B1A">LMEnt</strong> (<strong style="font-weight: 700; color: #1C1B1A">L</strong>anguage <strong style="font-weight: 700; color: #1C1B1A">M</strong>odels with annotated <strong style="font-weight: 700; color: #1C1B1A">Ent</strong>ity mentions), a suite of pretrained models, a knowledge-rich pretraining corpus fully annotated with fine-grained entity mentions, and an entity-based retrieval method which allows full transparency into where a specific entity is mentioned in training.</p>
</div>

<section style="display: flex; flex-direction: column; gap: 28px" aria-labelledby="fig2-title">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 id="fig2-title" style="margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600; font-size: 40px; line-height: 1.1">Annotating every entity mention</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #2A2826; text-wrap: pretty">Entities can be mentioned explicitly by name, or implicitly through pronouns, aliases, and generic descriptors like <span style="background: #D3E8C6; border-radius: 4px; padding: 1px 4px">the team</span>. We link each mention to a Wikidata QID using three sources, each with its own score. Entity-based retrieval retrieves chunks from the pretraining data corpus that mention an entity matching a given entity QID and source score threshold, so the aliases of <span style="background: #D3E8C6; border-radius: 4px; padding: 1px 4px">Buffalo</span> the team and <span style="background: #F7DDB8; border-radius: 4px; padding: 1px 4px">Buffalo</span> the city are disambiguated.</p>
</div>

</div>
<div style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.06); padding: 20px 22px; display: flex; flex-direction: column; gap: 8px">

ows how many mentions still match.</span></div></div><button type="button" class="btn" onClick="{{helpOff}}" style="align-self: flex-start; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #1C1B1A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Start exploring</button></div></div></sc-if>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px">
<h3 style="margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15">Retrieval that understands entities</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #2A2826; text-wrap: pretty">Because every mention maps to a Wikidata QID identifier, finding an entity in the training data becomes a QID lookup instead of exact matching on a string. Compared with string-based baselines, LMEnt retrieves more correct mentions for 66–80% of entities, and keeps precision above 97% even when 100K chunks are retrieved for the entity.</p>

<figcaption style="font-size: 14px; line-height: 1.55; color: #5E5A55; text-wrap: pretty">Pairwise wins rate for entity-based retrieval (LMEnt) with multiple string-based retrieval methods and ablations. LMEnt’s entity-based retrieval outperforms string-based methods by 66.7%–80.4%. Ablations (bottom three rows) show that hyperlinks and entity linking are the most crucial sources of entity mentions.</figcaption>

    var ii = cInfo(c, p[0], p[1], 'Brittleness ' + BRIT.x[i].toFixed(1), 'Edit success ' + BRIT.y[i].toFixed(2) + ' · band ' + BRIT.lo[i].toFixed(2) + '–' + BRIT.hi[i].toFixed(2));
    c.marks.push({ d: shapePath('circle', r1(p[0]), r1(p[1]), 4.5), fill: '#2E78B7', stroke: 'none', sw: 0, i: ii });

  });

}

var WINS = [['CI-SS Canonical', 66.7, 12.6, 20.7], ['CI-SS Expanded', 80.4, 9.9, 9.7], ['CS-SS Canonical', 66.3, 12.3, 21.4], ['CS-SS Expanded', 79.1, 9.8, 11.1], ['LMEnt -C', 27.3, 43.9, 28.9], ['LMEnt -EL -C', 43.4, 23.3, 33.3], ['LMEnt -H -C', 52.1, 18.6, 29.3]];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { useH: true, useEL: true, useC: true, tEL: 0.6, tC: 0.6, hover: null, pinned: 'm1', qidInput: 'Q221626', qid: 'Q221626', sel: 0, showHelp: false, showHelp2: false, showBib: false, copied: '', tip: null, lfPanel: 'Overall', lfFocus: null };
  }

  keep(m) {
    var s = this.state;
    return (s.useH && m.H >= 1) || (s.useEL && m.EL >= s.tEL) || (s.useC && m.C >= s.tC);
  }

  figureVals() {
    var self = this, s = this.state;
    var activeId = s.hover || s.pinned;
    var act = activeId ? M[activeId] : null;
    var acl = act ? act.cl : null;

    var mentionSeg = function (m, ctx) {
      // ctx: null for a standalone mention; 'inner' for a part of a nested group
      var c = CL[m.cl], k = self.keep(m);
      var inAct = acl && m.cl === acl;
      var bg = k ? c.tint : 'transparent';
      var shadows = [], outline = 'none', deco = k ? 'none' : 'underline dotted #8C867D 2px', op = 1;
      if (ctx === 'outer') bg = 'transparent';
      if (acl) {
        if (inAct && ctx !== 'outer') {
          if (k) shadows.push('0 0 0 1.5px ' + c.strong);
          else outline = '1.5px dashed ' + c.strong;
          if (m.id === activeId) shadows.push('0 0 0 2.5px ' + c.strong);
        } else if (!inAct && ctx !== 'inner-of-active') {
          op = 0.3;
        }
      }
      var style = 'background:' + bg + ';box-shadow:' + (shadows.length ? shadows.join(',') : 'none') + ';outline:' + outline + ';outline-offset:-1px;text-decoration:' + deco + ';text-underline-offset:4px;opacity:' + op;
      return {
        isText: false, isMention: true, isGroup: false, text: m.text, style: style, pressed: s.pinned === m.id,
        aria: '“' + m.surface + '”, ' + c.qid + ' ' + c.name + (k ? '' : ', filtered out'),
        enter: function () { self.setState({ hover: m.id }); },
        leave: function () { self.setState({ hover: null }); },
        pin: function () { self.setState({ pinned: self.state.pinned === m.id ? null : m.id }); }
      };
    };

    var chunks = CHUNKS.map(function (ch) {
      var segs = [];
      ch.segs.forEach(function (sg) {
        if (!Array.isArray(sg)) { segs.push({ isText: true, isMention: false, isGroup: false, text: sg }); return; }
        var m = M[sg[0]];
        if (m.parent) {
          // nested mention: fold it and its parent into one group whose outline spans both
          var outer = M[m.parent], prev = segs.pop();
          var oc = CL[outer.cl], ok = self.keep(outer), outerAct = acl === outer.cl;
          var gShadow = 'none', gOp = 1;
          if (outerAct && ok) gShadow = outer.id === activeId ? '0 0 0 2.5px ' + oc.strong : '0 0 0 1.5px ' + oc.strong;
          if (outerAct && !ok) gShadow = 'none';
          if (acl && !outerAct && acl !== m.cl) gOp = 0.3;
          var outerPart = mentionSeg(outer, 'outer');
          if (acl === m.cl) outerPart.style = outerPart.style.replace(/opacity:[^;]*$/, 'opacity:0.3');
          else outerPart.style = outerPart.style.replace(/opacity:[^;]*$/, 'opacity:1');
          var innerPart = mentionSeg(m, outerAct ? 'inner-of-active' : 'inner');
          if (!acl || acl !== m.cl) innerPart.style = innerPart.style.replace(/opacity:[^;]*$/, 'opacity:1');
          segs.push({
            isText: false, isMention: false, isGroup: true,
            style: 'background:' + (ok ? oc.tint : 'transparent') + ';' + (gShadow !== 'none' ? 'outline:' + (outer.id === activeId ? '2.5px' : '1.5px') + ' solid ' + oc.strong + ';outline-offset:0;' : '') + (outerAct && !ok ? 'outline:1.5px dashed ' + oc.strong + ';outline-offset:-1px;' : '') + 'display:inline-block;max-width:100%;line-height:1.3;vertical-align:baseline;border-radius:4px;padding:0;opacity:' + gOp + ';box-decoration-break:clone;-webkit-box-decoration-break:clone',
            parts: [outerPart, innerPart]
          });
          void prev;
          return;
        }
        segs.push(mentionSeg(m, null));
      });
      return { label: ch.label, lead: ch.lead, segs: segs };
    });

    var kept = ORDER.filter(function (id) { return self.keep(M[id]); }).length;

    var card = { empty: !act, has: !!act };
    if (act) {
      var c = CL[act.cl], kAct = this.keep(act);
      var row = function (on, val, thr, pass, disp) {
        var ok = on && pass;
        return {
          op: on ? 1 : 0.45, disp: disp,
          bar: 'width:' + Math.round(val * 100) + '%;background:' + (ok ? c.strong : '#B9B3AA'),
          thr: 'left:' + Math.round(thr * 100) + '%',
          status: !on ? 'source off' : (pass ? 'passes' : 'below threshold'),
          statusColor: !on ? '#5E5A55' : (pass ? '#2F6B25' : '#9A3B1E')
        };
      };
      var members = ORDER.filter(function (id) { return M[id].cl === act.cl; });
      var keptMembers = members.filter(function (id) { return self.keep(M[id]); }).length;
      card.surface = act.surface;
      card.qid = c.qid; card.name = c.name; card.tint = c.tint; card.strong = c.strong;
      card.pinLabel = s.pinned === act.id ? 'Pinned · click to unpin' : 'Click to pin';
      card.h = row(s.useH, act.H, 1, act.H >= 1, act.H >= 1 ? '1' : '0');
      card.el = row(s.useEL, act.EL, s.tEL, act.EL >= s.tEL, fmt2(act.EL));
      card.c = row(s.useC, act.C, s.tC, act.C >= s.tC, fmt2(act.C));
      card.verdict = kAct ? 'Kept under current settings.' : 'Filtered out under current settings.';
    }

    var legend = ['JA', 'BB', 'BUF', 'HO'].map(function (k) { return CL[k]; });

    return {
      chunks: chunks, card: card, legend: legend,
      keptCount: kept, totalCount: ORDER.length,
      useH: s.useH, useEL: s.useEL, useC: s.useC,
      tEL: s.tEL, tC: s.tC, tELfmt: fmt2(s.tEL), tCfmt: fmt2(s.tC),
      elOff: !s.useEL, cOff: !s.useC,
      toggleH: function () { self.setState({ useH: !self.state.useH }); },
      toggleEL: function () { self.setState({ useEL: !self.state.useEL }); },
      toggleC: function () { self.setState({ useC: !self.state.useC }); },
      setEL: function (e) { self.setState({ tEL: parseFloat(e.target.value) }); },
      setC: function (e) { self.setState({ tC: parseFloat(e.target.value) }); },
      showHelp: s.showHelp,
      helpOn: function () { self.setState({ showHelp: true }); },
      helpOff: function (e) { if (e && e.stopPropagation) e.stopPropagation(); self.setState({ showHelp: false }); },
      reset: function () { self.setState({ useH: true, useEL: true, useC: true, tEL: 0.6, tC: 0.6 }); }
    };
  }

  explorerVals() {
    var self = this, s = this.state;
    var q = s.qid;
    var meta = q ? QMETA[q] : null;
    var qidChips = QLIST.map(function (qq) {
      var mm = QMETA[qq], active = qq === q;
      return {
        qid: qq, name: mm.name, active: active,
        style: active ? 'background:' + mm.tint + ';border:1.5px solid ' + mm.strong + ';color:#1C1B1A' : 'background:#FFFFFF;border:1.5px solid #D5D9E0;color:#1C1B1A',
        pick: function () { self.setState({ qid: qq, qidInput: qq, sel: 0 }); }
      };
    });
    var xTicks = [0, 20000, 40000, 60000, 80000, 100000].map(function (t) {
      return { label: t === 0 ? '0' : (t / 1000) + 'K', style: 'left:' + (t / TOTAL * 100) + '%' };
    });
    var out = {
      showHelp2: s.showHelp2,
      help2On: function () { self.setState({ showHelp2: true }); },
      help2Off: function (e) { if (e && e.stopPropagation) e.stopPropagation(); self.setState({ showHelp2: false }); },
      qidInput: s.qidInput, qidChips: qidChips, xTicks: xTicks, lossPoints: LOSS_POINTS,
      hasQid: !!meta, noQid: !meta && s.qidInput.trim().length > 0,
      onQid: function (e) {
        var v = e.target.value;
        var key = v.trim().toUpperCase();
        self.setState({ qidInput: v, qid: QMETA[key] ? key : null, sel: 0 });
      },
      plot: { qid: '', name: '', tint: '#EEE', strong: '#999', markers: [], lines: [], count: 0, nExp: 0, nImp: 0 },
      detail: { step: '', doc: '', lead: '', segs: [], mentions: [], kind: '', kindStyle: '', atStart: true, atEnd: true },
      prevStep: function () { self.setState({ sel: Math.max(0, self.state.sel - 1) }); },
      nextStep: function () { self.setState({ sel: Math.min((MARKERS[self.state.qid] || []).length - 1, self.state.sel + 1) }); }
    };
    if (!meta) return out;

    var list = MARKERS[q];
    var sel = Math.min(s.sel, list.length - 1);
    var markers = [], lines = [], nExp = 0;
    list.forEach(function (mkr, i) {
      if (mkr.explicit) nExp++;
      var x = mkr.t / TOTAL * 1000, y = yOf(lossAt(mkr.t));
      var selected = i === sel, size = selected ? 22 : 15;
      var fill = mkr.explicit ? meta.strong : '#FFFFFF';
      markers.push({
        selected: selected,
        aria: 'Step ' + mkr.t.toLocaleString('en-US') + ', ' + (mkr.explicit ? 'explicit' : 'implicit') + ' mention',
        style: 'left:' + (x / 10) + '%;top:' + (y / 320 * 100) + '%;width:' + size + 'px;height:' + size + 'px;background:' + fill + ';border:' + (mkr.explicit ? '2px solid #FFFFFF' : '3px solid ' + meta.strong) + ';box-shadow:' + (selected ? '0 0 0 3px ' + meta.strong + ', 0 2px 6px rgba(0,0,0,.25)' : '0 1px 3px rgba(0,0,0,.25)') + ';z-index:' + (selected ? 3 : 2),
        pick: function () { self.setState({ sel: i }); }
      });
      lines.push({ x: x.toFixed(1), y: y.toFixed(1), color: selected ? meta.strong : meta.tint, w: selected ? 2 : 1.5, op: selected ? 1 : 0.9 });
    });
    // draw the selected connector last so it sits on top
    var selLine = lines.splice(sel, 1)[0]; lines.push(selLine);

    out.plot = { qid: q, name: meta.name, tint: meta.tint, strong: meta.strong, markers: markers, lines: lines, count: list.length, nExp: nExp, nImp: list.length - nExp };

    var cur = list[sel], chunk = POOL[cur.ex];
    var segs = chunk.segs.map(function (sg) {
      if (typeof sg === 'string') return { text: sg, style: '' };
      var hit = sg.q === q || sg.pq === q;
      return { text: sg.t, style: hit ? 'background:' + meta.tint + ';box-shadow:inset 0 -2px 0 ' + meta.strong + ';border-radius:3px;padding:1px 2px' : '' };
    });
    var mentions = chunk.segs.filter(function (sg) { return typeof sg !== 'string' && sg.q === q; }).map(function (sg) {
      return { text: sg.surface, scores: 'H ' + (sg.H >= 1 ? '1' : '0') + ' · EL ' + fmt2(sg.EL) + ' · C ' + fmt2(sg.C) + ' · ' + (isExplicit(sg) ? 'explicit' : 'implicit') };
    });
    out.detail = {
      step: cur.t.toLocaleString('en-US'), doc: chunk.doc, lead: chunk.lead, segs: segs, mentions: mentions,
      kind: cur.explicit ? 'explicit mention' : 'implicit mention only',
      kindStyle: cur.explicit ? 'background:' + meta.strong + ';color:#FFFFFF' : 'background:#FFFFFF;color:' + meta.strong + ';box-shadow:inset 0 0 0 1.5px ' + meta.strong,
      atStart: sel <= 0, atEnd: sel >= list.length - 1
    };
    return out;
  }

  bibVals() {
    var self = this, s = this.state;
    return {
      bibtex: BIBTEX, showBib: s.showBib,
      bibBtnBg: s.showBib ? '#FFFFFF' : '#1C1B1A', bibBtnFg: s.showBib ? '#1C1B1A' : '#FFFFFF',
      copyLabel: s.copied === 'ok' ? 'Copied' : (s.copied === 'fail' ? 'Select the text to copy' : 'Copy'),

  attach(c, key) {

  chartVals() {

      boxChart: this.attach(buildBoxes(), 'box'),

      lfBtns: ['Overall', 'Country', 'Religion'].map(function (n) {

  }
}

(function () {
  // On narrow screens, shrink each chart to fit its card instead of scrolling.
  function fit() {
    document.querySelectorAll('.chartwrap').forEach(function (w) {
      var box = w.firstElementChild; if (!box) return;
      box.style.zoom = '';
      var need = box.offsetWidth, have = w.clientWidth;
      if (need > have + 1) box.style.zoom = (have / need).toFixed(3);
    });
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  setTimeout(fit, 50);
})();
